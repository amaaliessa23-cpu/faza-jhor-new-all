<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>فزعة | Black Crest</title>
    <meta name="description" content="نسخة إنتاجية بفخامة الشعار الرسمي والدرع الذهبي لإعلان سناب شات مباشر." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
    <style>
      :root {
        --gold: #d5a83d;
        --gold-2: #f0d68a;
        --panel: rgba(14, 18, 27, 0.84);
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Cairo", system-ui, sans-serif;
        color: #fff7e1;
        background: radial-gradient(circle at top, rgba(213,168,61,.2), transparent 26%), linear-gradient(180deg, #14161f, #040507);
      }
      .hero {
        min-height: 100vh;
        padding: 24px 18px 30px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        gap: 22px;
      }
      .topbar { display: flex; justify-content: center; }
      .badge {
        padding: 8px 16px;
        border-radius: 999px;
        background: rgba(240, 214, 138, 0.08);
        border: 1px solid rgba(240, 214, 138, 0.24);
        font-weight: 700;
      }
      .crest {
        width: min(88vw, 470px);
        margin: 0 auto;
        display: block;
        filter: drop-shadow(0 30px 50px rgba(0,0,0,.45));
      }
      .content {
        width: min(100%, 430px);
        margin: 0 auto;
        padding: 24px 20px 26px;
        background: var(--panel);
        border: 1px solid rgba(255,255,255,.08);
        border-radius: 28px;
        text-align: center;
        box-shadow: 0 26px 50px rgba(0,0,0,.36);
      }
      h1 {
        margin: 0;
        font-size: clamp(2rem, 9vw, 3.2rem);
        line-height: 1.02;
        font-weight: 900;
      }
      p {
        margin: 14px auto 0;
        max-width: 23ch;
        color: #ddd6c2;
        line-height: 1.9;
      }
      .stats {
        margin-top: 18px;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
      }
      .stat {
        padding: 12px 8px;
        border-radius: 16px;
        background: rgba(255,255,255,.04);
        border: 1px solid rgba(255,255,255,.08);
      }
      .stat strong {
        display: block;
        font-size: 1rem;
        color: var(--gold-2);
      }
      .stat span {
        display: block;
        margin-top: 4px;
        color: #d5cfbc;
        font-size: .8rem;
      }
      .cta {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        margin-top: 22px;
        padding: 16px 30px;
        border-radius: 18px;
        background: linear-gradient(180deg, #f0d68a, #be8d21);
        color: #141414;
        text-decoration: none;
        font-weight: 900;
        font-size: 1.08rem;
      }
      .footer-note {
        text-align: center;
        color: rgba(255,255,255,.56);
        font-size: .84rem;
      }
      @media (max-width: 480px) {
        .stats { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <main class="hero">
      <div class="topbar"><div class="badge">نسخة رسمية</div></div>
      <img class="crest" src="2.png" alt="شعار فزعة الرسمي" />
      <section class="content">
        <h1>شعار يبيع<br />الثقة قبل المنتج</h1>
        <p>اتجاه بصري مناسب لحملات سناب التي تحتاج حضور رسمي، ثبات بصري، ورسالة تحويل قوية وواضحة.</p>
        <div class="stats">
          <div class="stat"><strong>رسمي</strong><span>يوحي بالاعتماد</span></div>
          <div class="stat"><strong>فاخر</strong><span>يعزز قيمة العرض</span></div>
          <div class="stat"><strong>واضح</strong><span>مناسب للإعلانات السريعة</span></div>
        </div>
        <a class="cta" href="../order.html">أطلب ألان</a>
      </section>
      <div class="footer-note">جاهز للاستخدام في سناب، الستوري، والإعلانات القصيرة.</div>
    </main>
  </body>
</html>
