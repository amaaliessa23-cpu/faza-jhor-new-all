<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>فزعة | العرض الذهبي</title>
    <meta name="description" content="عرض فزعة الذهبي بصيغة جاهزة للإعلان على سناب شات مع دعوة مباشرة للطلب." />
    <meta property="og:title" content="فزعة | العرض الذهبي" />
    <meta property="og:description" content="هوية فخمة ولمعة ذهبية ورسالة مباشرة تقود إلى الطلب." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
    <style>
      :root {
        --gold: #e3ba52;
        --gold-soft: #f5df9d;
        --ink: #081126;
        --cream: #fff8e6;
        --muted: #d9e6ff;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Cairo", system-ui, sans-serif;
        color: var(--cream);
        background:
          radial-gradient(circle at 50% 18%, rgba(243, 203, 88, 0.34), transparent 18%),
          radial-gradient(circle at 18% 80%, rgba(243, 203, 88, 0.12), transparent 22%),
          linear-gradient(180deg, #0e1732, #050a16);
      }
      .scene {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        position: relative;
        overflow: hidden;
      }
      .ring, .ring::before, .ring::after {
        position: absolute;
        border-radius: 50%;
        border: 1px solid rgba(238, 201, 94, 0.2);
        content: "";
      }
      .ring { width: 66vmin; height: 66vmin; max-width: 620px; max-height: 620px; }
      .ring::before { inset: 8%; }
      .ring::after { inset: 18%; }
      .spark {
        position: absolute;
        width: 8px;
        height: 8px;
        background: var(--gold-soft);
        border-radius: 50%;
        box-shadow: 0 0 24px var(--gold-soft);
      }
      .s1 { top: 14%; left: 18%; }
      .s2 { top: 24%; right: 16%; }
      .s3 { bottom: 18%; left: 20%; }
      .s4 { bottom: 22%; right: 22%; }
      .card {
        position: relative;
        width: min(100%, 450px);
        padding: 28px 22px 24px;
        border-radius: 34px;
        background: linear-gradient(180deg, rgba(15, 25, 54, 0.92), rgba(8, 15, 33, 0.95));
        border: 1px solid rgba(243, 203, 88, 0.34);
        box-shadow: 0 28px 90px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255,255,255,0.1);
        backdrop-filter: blur(18px);
        text-align: center;
      }
      .logo-wrap {
        width: 124px;
        height: 124px;
        margin: 0 auto 14px;
        display: grid;
        place-items: center;
        border-radius: 30px;
        background: radial-gradient(circle, rgba(243,203,88,.22), transparent 65%);
      }
      .logo-wrap img {
        width: 108px;
        display: block;
        filter: drop-shadow(0 10px 24px rgba(231, 188, 70, 0.25));
      }
      .eyebrow {
        display: inline-flex;
        padding: 7px 14px;
        border-radius: 999px;
        background: rgba(227, 186, 82, 0.15);
        border: 1px solid rgba(227, 186, 82, 0.32);
        color: var(--gold-soft);
        font-weight: 700;
        font-size: .88rem;
      }
      h1 {
        margin: 14px 0 10px;
        font-size: clamp(2rem, 9vw, 3.15rem);
        line-height: 1.04;
        font-weight: 900;
      }
      p {
        margin: 0 auto;
        max-width: 24ch;
        color: var(--muted);
        font-size: 1rem;
        line-height: 1.8;
      }
      .benefits {
        margin: 18px 0 0;
        padding: 0;
        list-style: none;
        display: grid;
        gap: 10px;
      }
      .benefits li {
        padding: 10px 14px;
        border-radius: 16px;
        background: rgba(255,255,255,.04);
        border: 1px solid rgba(255,255,255,.08);
        color: #eef4ff;
        font-size: .95rem;
        font-weight: 700;
      }
      .cta {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        margin-top: 22px;
        padding: 16px 28px;
        border-radius: 999px;
        background: linear-gradient(180deg, #f3d98f, #c5941d);
        color: var(--ink);
        text-decoration: none;
        font-weight: 900;
        font-size: 1.1rem;
        box-shadow: 0 18px 32px rgba(201, 148, 29, 0.32);
      }
      .cta-note {
        margin-top: 10px;
        color: rgba(255,248,230,.66);
        font-size: .82rem;
      }
      @media (max-width: 480px) {
        .scene { padding: 16px; }
        .card { padding: 22px 16px 18px; border-radius: 28px; }
        .logo-wrap { width: 104px; height: 104px; }
        .logo-wrap img { width: 92px; }
      }
    </style>
  </head>
  <body>
    <main class="scene">
      <div class="ring" aria-hidden="true"></div>
      <div class="spark s1"></div>
      <div class="spark s2"></div>
      <div class="spark s3"></div>
      <div class="spark s4"></div>
      <section class="card">
        <div class="logo-wrap"><img src="image.png" alt="شعار فزعة" /></div>
        <div class="eyebrow">العرض الذهبي</div>
        <h1>هيبة من أول<br />مشاهدة</h1>
        <p>صفحة إعلان جاهزة لسناب شات بنبرة فخمة ورسالة واضحة تقود مباشرة إلى التحويل والطلب.</p>
        <ul class="benefits">
          <li>رسالة مباشرة وسريعة الفهم</li>
          <li>هوية ذهبية ترفع قيمة العرض</li>
          <li>زر طلب واضح ومهيأ للتحويل</li>
        </ul>
        <a class="cta" href="../order.html">أطلب ألان</a>
        <div class="cta-note">استجابة سريعة ومظهر جاهز للإطلاق الإعلاني.</div>
      </section>
    </main>
  </body>
</html>
