<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>فزعة | Glass Motion</title>
    <meta name="description" content="نسخة إنتاجية حديثة بطابع زجاجي ولمسة تقنية مناسبة للمنصات السريعة مثل سناب شات." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
    <style>
      :root {
        --gold: #e2bb53;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Cairo", system-ui, sans-serif;
        background: linear-gradient(140deg, #09132c 10%, #173274 45%, #071126 100%);
        color: #f6f8ff;
        overflow: hidden;
      }
      .bg-band, .bg-band::before, .bg-band::after {
        position: absolute;
        inset: auto;
        content: "";
        transform: rotate(-18deg);
        background: linear-gradient(90deg, transparent, rgba(255,255,255,.08), transparent);
      }
      .bg-band { width: 120vw; height: 140px; top: 14%; left: -10vw; }
      .bg-band::before { width: 120vw; height: 110px; top: 210px; left: 0; }
      .bg-band::after { width: 120vw; height: 90px; top: 390px; left: 0; }
      .page {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        position: relative;
      }
      .shell {
        width: min(100%, 450px);
        padding: 20px;
        border-radius: 34px;
        background: rgba(255,255,255,.08);
        border: 1px solid rgba(255,255,255,.14);
        box-shadow: 0 30px 60px rgba(0,0,0,.28);
        backdrop-filter: blur(18px);
      }
      .logo {
        width: 170px;
        display: block;
        margin: 0 auto 16px;
        filter: drop-shadow(0 16px 30px rgba(226,187,83,.22));
      }
      .copy {
        text-align: center;
        padding: 22px 18px;
        border-radius: 26px;
        background: rgba(8, 16, 40, 0.68);
        border: 1px solid rgba(226,187,83,.28);
      }
      .tag {
        display: inline-flex;
        padding: 6px 12px;
        border-radius: 999px;
        background: rgba(226,187,83,.18);
        color: #ffe7a0;
        font-weight: 700;
      }
      h1 {
        margin: 14px 0 10px;
        font-size: clamp(2rem, 9vw, 3rem);
        line-height: 1.05;
        font-weight: 900;
      }
      p {
        margin: 0 auto;
        max-width: 22ch;
        color: #d8e5ff;
        line-height: 1.85;
      }
      .features {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        justify-content: center;
        margin-top: 18px;
      }
      .features span {
        padding: 8px 12px;
        border-radius: 999px;
        background: rgba(255,255,255,.08);
        border: 1px solid rgba(255,255,255,.12);
        font-size: .84rem;
        color: #eef4ff;
      }
      .cta {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        margin-top: 20px;
        padding: 15px 28px;
        border-radius: 999px;
        background: #f6f8ff;
        color: #12295f;
        text-decoration: none;
        font-weight: 900;
      }
      .subnote {
        margin-top: 10px;
        font-size: .82rem;
        color: rgba(216,229,255,.7);
      }
    </style>
  </head>
  <body>
    <div class="bg-band" aria-hidden="true"></div>
    <main class="page">
      <section class="shell">
        <img class="logo" src="image.png" alt="شعار فزعة" />
        <div class="copy">
          <div class="tag">نسخة حديثة</div>
          <h1>خفيفة بصرياً<br />لكنها جاهزة للبيع</h1>
          <p>هذه النسخة تناسب الحملات التي تحتاج مظهر معاصر، مع بقاء الهوية فخمة وسهلة التذكر في سناب.</p>
          <div class="features">
            <span>مظهر تقني</span>
            <span>وضوح في الرسالة</span>
            <span>CTA مباشر</span>
          </div>
          <a class="cta" href="../order.html">أطلب ألان</a>
          <div class="subnote">قابلة للتوسعة إلى فيديو قصير أو ستوري متحرك بسهولة.</div>
        </div>
      </section>
    </main>
  </body>
</html>
