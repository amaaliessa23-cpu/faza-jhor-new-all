<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1" name="viewport" />
    <meta name="robots" content="noindex, nofollow" />
    <title>تم بنجاح</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #f8f9fa;
            color: #333;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .success-card {
            max-width: 450px;
            width: 90%;
            padding: 40px 30px;
            text-align: center;
            border-radius: 24px;
            background: #fff;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.08);
            transform: translateY(20px);
            opacity: 0;
            animation: slideUp 0.6s ease forwards;
        }

        @keyframes slideUp {
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        /* Animated Checkmark */
        .checkmark-wrapper {
            width: 100px;
            height: 100px;
            margin: 0 auto 30px;
        }

        .checkmark {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            display: block;
            stroke-width: 2;
            stroke: #fff;
            stroke-miterlimit: 10;
            box-shadow: inset 0px 0px 0px #7ac142;
            animation: fill .4s ease-in-out .4s forwards, scale .3s ease-in-out .9s both;
        }

        .checkmark__circle {
            stroke-dasharray: 166;
            stroke-dashoffset: 166;
            stroke-width: 2;
            stroke-miterlimit: 10;
            stroke: #7ac142;
            fill: none;
            animation: stroke 0.6s cubic-bezier(0.65, 0, 0.45, 1) forwards;
        }

        .checkmark__check {
            transform-origin: 50% 50%;
            stroke-dasharray: 48;
            stroke-dashoffset: 48;
            animation: stroke 0.3s cubic-bezier(0.65, 0, 0.45, 1) 0.8s forwards;
        }

        @keyframes stroke {
            100% {
                stroke-dashoffset: 0;
            }
        }

        @keyframes scale {
            0%, 100% {
                transform: none;
            }
            50% {
                transform: scale3d(1.1, 1.1, 1);
            }
        }

        @keyframes fill {
            100% {
                box-shadow: inset 0px 0px 0px 50px #7ac142;
            }
        }

        .main-title {
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 15px;
            color: #2d3436;
        }

        .divider {
            height: 2px;
            width: 50px;
            background-color: #7ac142;
            margin: 20px auto;
            border-radius: 2px;
        }

        .message {
            font-size: 16px;
            color: #636e72;
            line-height: 1.8;
            margin-bottom: 35px;
        }

        .home-btn {
            display: inline-block;
            padding: 14px 40px;
            font-size: 16px;
            font-weight: 600;
            color: #fff;
            background-color: #7ac142;
            border: none;
            border-radius: 12px;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(122, 193, 66, 0.3);
        }

        .home-btn:hover {
            background-color: #69a838;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(122, 193, 66, 0.4);
            color: #fff;
            text-decoration: none;
        }
    </style>
</head>

<body>
    <div class="success-card">
        <div class="checkmark-wrapper">
            <svg class="checkmark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 52 52">
                <circle class="checkmark__circle" cx="26" cy="26" r="25" fill="none" />
                <path class="checkmark__check" fill="none" d="M14.1 27.2l7.1 7.2 16.7-16.8" />
            </svg>
        </div>
        
        <h1 class="main-title">تم استلام طلبك بنجاح</h1>
        
        <div class="divider"></div>

        <p class="message">شكرًا لك! تم استلام طلبك بنجاح. سيتواصل معك فريق التوصيل في الوقت المحدد لتسليم المنتج.</p>

    </div>
</body>
</html>
